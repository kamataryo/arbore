<!doctype html>
<!--
  GitHub ソーシャルイメージ (1280x640)
  撮影: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
          --window-size=1280,640 --virtual-time-budget=3000 \
          --screenshot="$PWD/social/social.png" "file://$PWD/social/social.html"
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Arboré Social Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,144,600;1,144,400&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --bg: #fbf7f0; --ink: #4a3f36; --sub: #8a7d70; --chip: #f1eadf; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body {
    display: flex; align-items: center; gap: 56px; padding: 0 96px 0 72px;
    color: var(--ink);
  }
  svg { flex: none; width: 480px; height: 480px; }
  h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 148px; line-height: 1; letter-spacing: -2px; }
  p { margin-top: 20px; font: italic 400 34px/1.3 "Fraunces", serif; color: var(--sub); }
  code {
    display: inline-block; margin-top: 36px; padding: 14px 24px; border-radius: 14px;
    background: var(--chip); font: 500 26px "JetBrains Mono", monospace;
  }
  code b { color: #d98ba0; font-weight: 500; }
</style>
</head>
<body>
  <svg viewBox="0 0 400 400" aria-label="Arboré logo">
    <!-- 幹: 半径の違う円弧 2 本で作る三日月 -->
    <path d="M200 385 A 200 200 0 0 1 200 140 A 280 280 0 0 0 200 385 Z" fill="#6b5b4e"/>
    <!-- 枝: 幹と同じく円弧 2 本の三日月。長さ・反り・角度はわざと不揃い -->
    <g fill="#6b5b4e">
      <path d="M168 290 A 120 120 0 0 0 305 212 A 190 190 0 0 1 168 290 Z"/>
      <path d="M166 230 A 85 85 0 0 1 78 168 A 140 140 0 0 0 166 230 Z"/>
      <path d="M182 184 A 100 100 0 0 0 258 96 A 170 170 0 0 1 182 184 Z"/>
    </g>
    <circle cx="307" cy="200" r="24" fill="#ffb5c2"/>
    <circle cx="76"  cy="155" r="21" fill="#b5dcff"/>
    <circle cx="259" cy="83"  r="19" fill="#c6efc4"/>
    <circle cx="197" cy="124" r="17" fill="#ffe3a1"/>
    <circle cx="124" cy="88"  r="11" fill="#d9c8ff"/>
    <circle cx="338" cy="271" r="8"  fill="#ffcfae"/>
  </svg>
  <div>
    <h1>Arboré</h1>
    <p>Sucre syntaxique pour <b>Git worktree</b></p>
    <code><b>$</b> arboré create hotfix/urgent</code>
  </div>
</body>
</html>
